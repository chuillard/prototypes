      borderRadius:"50%",background:"#fff",transition:"left .2s",boxShadow:"0 1px 3px rgba(0,0,0,.2)"}}/>
  </div>
);

function daysBetween(a, b) {
  try {
    const m = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const p = s => { const [mo,d,y] = s.trim().split(/[\s,]+/); return new Date(+y, m[mo], +d); };
    const n = Math.round((p(b)-p(a))/(864e5));
    return n > 0 ? n : null;
  } catch { return null; }
}

// ── content renderer ───────────────────────────────────────────
function ContentRenderer({ text }) {
  const lines = text.split('\n');
  return (
    <div style={{fontSize:14, color:T.text, lineHeight:1.75}}>
      {lines.map((line, i) => {
        if (line === '') return <div key={i} style={{height:6}}/>;
        if (line.startsWith('**') && line.endsWith('**') && line.length > 4)
          return <p key={i} style={{fontWeight:600, color:T.text, margin:"14px 0 6px"}}>{line.slice(2,-2)}</p>;
        if (line.startsWith('• '))
          return (
            <div key={i} style={{display:"flex", gap:10, marginBottom:5, paddingLeft:4}}>
              <span style={{color:T.purple, fontWeight:700, marginTop:1, flexShrink:0}}>•</span>
              <span style={{color:"#374151"}}>{parseBold(line.slice(2))}</span>
            </div>
          );
        if (/^\d+\.\s/.test(line)) {
          const m = line.match(/^(\d+)\.\s*(.*)/);
          return (
            <div key={i} style={{display:"flex", gap:10, marginBottom:5, paddingLeft:4}}>
              <span style={{color:T.purple, fontWeight:600, minWidth:16, flexShrink:0}}>{m[1]}.</span>
              <span style={{color:"#374151"}}>{parseBold(m[2])}</span>
            </div>
          );
        }
        return <p key={i} style={{marginBottom:4, color:"#374151"}}>{parseBold(line)}</p>;
      })}
    </div>
  );
}

function parseBold(text) {
  const parts = text.split(/\*\*(.*?)\*\*/);
  return parts.map((p, i) => i % 2 === 1 ? <strong key={i} style={{color:T.text}}>{p}</strong> : p);
}

}

// ── right-side detail panel ────────────────────────────────────
function SidePanel({ item, onEditSchedule, onRemoveSchedule }) {
  const [inUse,       setInUse]       = useState(true);
  const [detOpen,     setDetOpen]     = useState(true);
  const [schedOpen,   setSchedOpen]   = useState(true);
  const [impactOpen,  setImpactOpen]  = useState(true);
  const [ticketsOpen, setTicketsOpen] = useState(true);
  const [engageOpen,  setEngageOpen]  = useState(false);

  const SH = ({ label, open, toggle, extra }) => (
    <div onClick={toggle} style={{display:"flex",alignItems:"center",gap:6,padding:"11px 16px",cursor:"pointer",userSelect:"none",borderBottom:`1px solid ${T.gray}`}}>

      <span style={{fontSize:12,color:T.textSec}}>{l}</span>
      <span style={{fontSize:12,color:T.text}}>{v}</span>

  return (
    <div style={{width:296,flexShrink:0,borderLeft:`1px solid ${T.border}`,overflowY:"auto",background:"#fff"}}>

      {/* Details */}
      <div style={{borderBottom:`1px solid ${T.border}`}}>
        <SH label="Details" open={detOpen} toggle={()=>setDetOpen(!detOpen)}/>

          <div style={{padding:"6px 16px 12px",display:"flex",flexDirection:"column",gap:2}}>

                <TypeIcon type={item.type}/>

              </div>
            }/>
            <Row l="Status" v={<span style={{fontSize:11,padding:"2px 9px",borderRadius:20,fontWeight:500,background:T.greenLight,color:T.green,border:`1px solid ${T.greenMid}`}}>Published</span>}/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:`1px solid ${T.gray}`}}>
              <span style={{fontSize:12,color:T.textSec}}>In use by AI Agent</span>
              <Toggle on={inUse} onToggle={()=>setInUse(!inUse)}/>
            </div>
            <Row l="Created" v={item.created}/>
            <Row l="Last updated" v={item.updated}/>
            {item.helpCenter && <Row l="Help Center" v={<span style={{color:T.purple,cursor:"pointer",fontSize:12}}>{item.helpCenter}</span>}/>}
            {item.source==="copilot" && <Row l="Origin" v={
              <span style={{fontSize:11,padding:"2px 7px",borderRadius:10,background:T.blueLight,color:T.blue,fontWeight:600,display:"inline-flex",alignItems:"center",gap:3}}>
                🤖 Copilot
              </span>
            }/>}
          </div>
        )}
      </div>

      {/* Scheduling */}
      <div style={{borderBottom:`1px solid ${T.border}`,background:item.schedule?"#FEFCFF":"#fff"}}>
        <SH label="Scheduling" open={schedOpen} toggle={()=>setSchedOpen(!schedOpen)}
          extra={item.schedule&&<CalSvg c={T.purple} s={13}/>}/>
        {schedOpen && (
          <SchedulingSection item={item} onEdit={onEditSchedule} onRemove={onRemoveSchedule}/>
        )}
      </div>

      {/* Impact */}
      <div style={{borderBottom:`1px solid ${T.border}`}}>
        <SH label="Impact" open={impactOpen} toggle={()=>setImpactOpen(!impactOpen)}
          extra={<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="#9CA3AF" strokeWidth="1.3"/><path d="M8 7.5V11M8 5.5v.5" stroke="#9CA3AF" strokeWidth="1.3" strokeLinecap="round"/></svg>}/>
        {impactOpen && (
          <div style={{padding:"6px 16px 12px"}}>
            <div style={{fontSize:11,color:T.textMuted,marginBottom:8}}>Last 28 days</div>
            {[
              {l:"Tickets",        v:item.tickets ||"—"},
              {l:"Handover tickets",v:item.handover||"—"},
              {l:"CSAT",           v:item.csat?item.csat+" ★":"—"},
              {l:"Intents",        v:item.tickets?Math.round(item.tickets*.28):"—"},
            ].map(({l,v})=>(
              <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:`1px solid ${T.gray}`}}>
                <span style={{fontSize:12,color:T.textSec}}>{l}</span>
                <span style={{fontSize:12,color:v==="—"?T.textMuted:T.text,fontWeight:v==="—"?400:500}}>{v}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Recent tickets */}
      <div style={{borderBottom:`1px solid ${T.border}`}}>
        <SH label="Recent tickets" open={ticketsOpen} toggle={()=>setTicketsOpen(!ticketsOpen)}
          extra={<span style={{fontSize:11,fontWeight:600,padding:"1px 6px",borderRadius:10,background:T.gray,color:T.textSec}}>{item.tickets||0}</span>}/>
        {ticketsOpen && (
          <div style={{padding:"6px 16px 12px"}}>
            <div style={{fontSize:11,color:T.textMuted,marginBottom:8}}>Last 28 days</div>
            {item.tickets===0
              ? <div style={{fontSize:12,color:T.textMuted,textAlign:"center",padding:"10px 0"}}>This knowledge item has not been used by AI Agent yet</div>
              : [1,2].map(i=>(
                <div key={i} style={{padding:"7px 10px",borderRadius:8,border:`1px solid ${T.border}`,fontSize:12,color:T.textSec,marginBottom:5,cursor:"pointer"}}
                  onMouseEnter={e=>e.currentTarget.style.background=T.gray} onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                  #{10200+i*41} · Customer inquiry · <span style={{color:T.green}}>Resolved</span>
                </div>
              ))
            }
          </div>
        )}
      </div>

      {/* Engagement */}
      <div>
        <SH label="Engagement" open={engageOpen} toggle={()=>setEngageOpen(!engageOpen)}/>
        {engageOpen && (
          <div style={{padding:"6px 16px 12px"}}>
            <div style={{fontSize:11,color:T.textMuted,marginBottom:8}}>Last 28 days</div>
            {[{l:"Views",v:item.tickets?item.tickets*4:"—"},{l:"Rating",v:"—"}].map(({l,v})=>(
              <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:`1px solid ${T.gray}`}}>
                <span style={{fontSize:12,color:T.textSec}}>{l}</span>
                <span style={{fontSize:12,color:v==="—"?T.textMuted:T.text}}>{v}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── main app ───────────────────────────────────────────────────
function App() {
  const [items,   setItems]   = useState(ITEMS.map(i=>({...i})));
  const [selId,   setSelId]   = useState(null);   // null = list view
  const [modal,   setModal]   = useState(false);
  const [tab,     setTab]     = useState("all");
  const [search,  setSearch]  = useState("");

  const item = selId ? items.find(i=>i.id===selId) : null;

  const tabs = [
    {id:"all",        label:"All content",  count:items.length},
    {id:"guidance",   label:"Guidance",     count:items.filter(i=>i.type==="guidance").length},
    {id:"help-center",label:"Help Center",  count:items.filter(i=>i.type==="help-center").length},
    {id:"scheduled",  label:"Scheduled",    count:items.filter(i=>i.schedule).length},
  ];

  const list = items.filter(it => {
    if (search && !it.title.toLowerCase().includes(search.toLowerCase())) return false;
    if (tab==="guidance")    return it.type==="guidance";
    if (tab==="help-center") return it.type==="help-center";
    if (tab==="scheduled")   return !!it.schedule;
    return true;
  });

  const saveSchedule = sched => {
    setItems(prev => prev.map(x => x.id===selId ? {...x, schedule:sched} : x));
    setModal(false);
  };
  const removeSchedule = () => {
    setItems(prev => prev.map(x => x.id===selId ? {...x, schedule:null} : x));
  };

  // ── list (always visible in background) ──────────────────────
  const ListView = () => (
    <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden",background:T.white}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"13px 24px",borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
        <span style={{fontSize:18,fontWeight:700,color:T.text,letterSpacing:"-.02em"}}>Knowledge</span>
        <div style={{display:"flex",gap:8}}>
          <button style={{padding:"6px 13px",borderRadius:8,border:`1px solid ${T.border}`,background:"#fff",fontSize:13,fontWeight:500,color:T.text,cursor:"pointer",fontFamily:"Inter,sans-serif"}}>Go to skills →</button>
          <button style={{padding:"6px 13px",borderRadius:8,background:T.purple,color:"#fff",border:"none",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"Inter,sans-serif"}}>+ Add content</button>
        </div>
      </div>
      <div style={{borderBottom:`1px solid ${T.border}`,padding:"0 24px",display:"flex",flexShrink:0}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"10px 14px",background:"none",border:"none",cursor:"pointer",fontFamily:"Inter,sans-serif",fontSize:13,fontWeight:tab===t.id?600:400,color:tab===t.id?T.purple:T.textSec,borderBottom:tab===t.id?`2px solid ${T.purple}`:"2px solid transparent",marginBottom:-1,display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap"}}>
            {t.label}
            <span style={{fontSize:10,fontWeight:600,padding:"1px 6px",borderRadius:10,background:tab===t.id?T.purpleLight:T.gray,color:tab===t.id?T.purple:T.textSec}}>{t.count}</span>
          </button>
        ))}
      </div>
      <div style={{padding:"9px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
        <span style={{fontSize:13,color:T.textSec}}>{list.length} items</span>
        <div style={{position:"relative"}}>
          <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",fontSize:14,color:T.textMuted}}>⌕</span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..." style={{paddingLeft:28,paddingRight:10,paddingTop:7,paddingBottom:7,border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,outline:"none",width:210,fontFamily:"Inter,sans-serif"}}/>
        </div>
      </div>
      <div style={{overflowY:"auto",flex:1}}>
        {list.map(it => {
          const sel = it.id === selId;
          return (
            <div key={it.id} onClick={()=>setSelId(it.id===selId?null:it.id)}

                borderLeft: sel ? `3px solid ${T.purple}` : "3px solid transparent"}}

              onMouseLeave={e=>{ if(!sel) e.currentTarget.style.background="transparent"; }}>

              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:sel?600:500,color:sel?T.purpleDark:T.text,marginBottom:2}}>{it.title}</div>
                <div style={{fontSize:12,color:sel?T.purpleMid:T.textMuted,display:"flex",alignItems:"center",gap:8}}>
                  <span>{it.type==="help-center"?"Help Center article":"Guidance"}</span>
                  {it.schedule && <span style={{display:"flex",alignItems:"center",gap:4}}><CalSvg c={sel?T.purple:"#9CA3AF"} s={11}/>{it.schedule.from}{it.schedule.until?" → "+it.schedule.until:" onwards"}</span>}

                {it.source==="copilot"&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:10,background:T.blueLight,color:T.blue,fontWeight:500}}>🤖</span>}
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style={{transform:sel?"rotate(90deg)":"none",transition:"transform .2s"}}>
                  <path d="M6 12l4-4-4-4" stroke={sel?T.purple:"#9CA3AF"} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  const ItemPanel = () => (
    <div style={{position:"absolute",top:0,right:0,bottom:0,width:"72%",display:"flex",flexDirection:"column",
      background:T.white,borderLeft:`1px solid ${T.border}`,
      boxShadow:"-8px 0 32px rgba(0,0,0,.10)",zIndex:20}}>
      {/* Panel header */}
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 16px",borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
        <span style={{fontSize:13,fontWeight:600,color:T.text,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.title}</span>
        <div style={{display:"flex",gap:5,flexShrink:0}}>
          {[
            <svg key="e" width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M11.5 2.5L13.5 4.5 5 13H3v-2L11.5 2.5z" stroke="#6B7280" strokeWidth="1.4" strokeLinejoin="round"/></svg>,
            <svg key="h" width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="#6B7280" strokeWidth="1.3"/><path d="M8 5v3l2 1" stroke="#6B7280" strokeWidth="1.3" strokeLinecap="round"/></svg>,

          ].map((ico,i)=>(

          <button onClick={()=>setSelId(null)} style={{width:26,height:26,borderRadius:6,border:`1px solid ${T.border}`,background:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="#6B7280" strokeWidth="1.8" strokeLinecap="round"/></svg>
          </button>
        </div>
      </div>
      {/* Panel body: content + side panel */}
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        <div style={{flex:1,overflowY:"auto",padding:"28px 36px",minWidth:0}}>
          <h1 style={{fontSize:20,fontWeight:700,color:T.text,letterSpacing:"-.02em",marginBottom:20,lineHeight:1.3}}>{item.title}</h1>
          <ContentRenderer text={item.content}/>
        </div>
        <SidePanel item={item} onEditSchedule={()=>setModal(true)} onRemoveSchedule={removeSchedule}/>
      </div>
    </div>
  );

  return (
    <div style={{background:T.bg,display:"flex",height:"100vh",fontFamily:"Inter,sans-serif",overflow:"hidden"}}>
      <IconRail/>
      <NavPanel/>
      {/* Content column — list always visible; panel overlays from the right */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",background:T.white,position:"relative"}}>
        <ListView/>
        {item && <ItemPanel/>}
      </div>
      {modal && item && (
        <ScheduleModal key={`modal_${selId}`} item={item} onClose={()=>setModal(false)} onSave={saveSchedule}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
